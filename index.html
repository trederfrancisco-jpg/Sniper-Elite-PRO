    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 20% 50%, rgba(0, 255, 115, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(0, 255, 115, 0.05) 0%, transparent 50%), radial-gradient(circle at 40% 20%, rgba(155, 48, 255, 0.05) 0%, transparent 50%); animation: rotate 30s linear infinite; z-index: 0; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 255, 115, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 115, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: 0; }
        .container { background: linear-gradient(145deg, #121315 0%, #0a0b0d 100%); width: 100%; max-width: 420px; border-radius: 30px; padding: 45px 35px; border: 1px solid rgba(0, 255, 115, 0.2); box-shadow: 0 0 40px rgba(0, 255, 115, 0.1), 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05); text-align: center; position: relative; z-index: 1; animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .container::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: linear-gradient(90deg, transparent, #00ff73, transparent); box-shadow: 0 0 20px #00ff73; }
        .logo-container { margin-bottom: 10px; position: relative; }
        .logo-icon { width: 90px; height: 90px; display: inline-block; animation: pulse 2s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(0, 255, 115, 0.5)); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .header-title { font-size: 32px; font-weight: 900; color: #00ff73; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0, 255, 115, 0.5), 0 0 20px rgba(0, 255, 115, 0.3); }

        .description { color: #7a7f85; font-size: 13px; margin-bottom: 30px; line-height: 1.6; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group input { width: 100%; background: linear-gradient(145deg, #181a1f 0%, #0f1115 100%); border: 2px solid #2c2f36; border-radius: 12px; padding: 16px 20px 16px 50px; color: #ffffff; font-size: 15px; outline: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .input-group input:focus { border-color: #00ff73; box-shadow: 0 0 20px rgba(0, 255, 115, 0.2); transform: translateY(-2px); }
        .input-group input::placeholder { color: #4f535c; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 20px; transition: all 0.3s; }
        .options-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
        .remember-me { display: flex; align-items: center; gap: 8px; color: #7a7f85; cursor: pointer; }
        .remember-me input[type="checkbox"] { width: 16px; height: 16px; accent-color: #00ff73; cursor: pointer; }
        .forgot-password { color: #00ff73; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .forgot-password:hover { text-shadow: 0 0 10px rgba(0, 255, 115, 0.5); }
        .btn-pix { width: 100%; background: linear-gradient(135deg, #9b30ff 0%, #7b1fa2 100%); color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(155, 48, 255, 0.3); }
        .btn-pix:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(155, 48, 255, 0.5); }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #00ff73 0%, #00cc5c 100%); color: #000000; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; transition: all 0.3s; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(0, 255, 115, 0.4); }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0, 255, 115, 0.6); }
        .footer-link { color: #7a7f85; font-size: 14px; text-decoration: none; transition: all 0.3s; display: inline-block; margin-top: 10px; }
        .footer-link:hover { color: #00ff73; }
        .footer-link span { color: #00ff73; font-weight: 700; cursor: pointer; }
        .install-banner { background: linear-gradient(135deg, rgba(0, 255, 115, 0.1) 0%, rgba(0, 204, 92, 0.05) 100%); border: 1px solid rgba(0, 255, 115, 0.3); border-radius: 12px; padding: 15px; margin-top: 20px; display: none; animation: slideUp 0.5s ease; }
        .install-banner.show { display: block; }
        .install-banner p { color: #7a7f85; font-size: 12px; margin-bottom: 10px; }
        .btn-install { background: #00ff73; color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; }
        .hidden { display: none !important; }
        .back-link { color: #00ff73; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 20px; cursor: pointer; }
        .back-link:hover { text-shadow: 0 0 10px rgba(0, 255, 115, 0.5); }
        .password-strength { height: 4px; background: #2c2f36; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
        .password-strength.show { display: block; }
        .password-strength-bar { height: 100%; width: 0; transition: all 0.3s; border-radius: 2px; }
        .password-strength-bar.weak { width: 33%; background: #f6465d; }
        .password-strength-bar.medium { width: 66%; background: #ffca28; }
        .password-strength-bar.strong { width: 100%; background: #00ff73; }
        @media (max-width: 480px) { .container { padding: 35px 25px; border-radius: 25px; } .header-title { font-size: 28px; } .header-subtitle { font-size: 18px; letter-spacing: 6px; } }
    </style>
