<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo preto arredondado -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Borda verde neon -->
  <rect width="512" height="512" rx="100" fill="none" stroke="#00ff73" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Alvo - Anéis -->
  <circle cx="256" cy="230" r="145" fill="#f6465d"/>
  <circle cx="256" cy="230" r="110" fill="#ffffff"/>
  <circle cx="256" cy="230" r="80" fill="#f6465d"/>
  <circle cx="256" cy="230" r="50" fill="#ffffff"/>
  <circle cx="256" cy="230" r="20" fill="#f6465d"/>
  
  <!-- Dardo azul -->
  <g transform="translate(256,230) rotate(-45)">
    <!-- Haste do dardo -->
    <rect x="-8" y="-130" width="16" height="130" fill="#42a5f5" rx="5"/>
    <!-- Ponta do dardo -->
    <polygon points="0,15 -20,45 0,40 20,45" fill="#42a5f5"/>
    <!-- Asas do dardo -->
    <polygon points="-25,45 -25,55 25,55 25,45" fill="#42a5f5"/>
  </g>
</svg>
